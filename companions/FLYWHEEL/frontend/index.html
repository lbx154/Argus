<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1017" />
    <meta name="description" content="Argus Research Data Flywheel — evidence-first research control plane" />
    <title>Argus Flywheel</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('argus-flywheel.theme') || 'dark'
          const theme = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.lang = localStorage.getItem('argus-flywheel.locale') || 'zh-CN'
        } catch { /* preference provider will apply safe defaults */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
