<!doctype html>
<html lang="en">
<head>

<title>Dense Intelligence Across the Horizon</title>
<style>
@page { size: 12in 5.4in; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { background: #fbf7ee; font-family: Arial, Helvetica, sans-serif; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
.figure { position: relative; width: 12in; height: 5.4in; overflow: hidden; background: #fbf7ee; border-top: .055in solid #24465d; }
.base { position: absolute; left: .20in; top: .1375in; width: 11.60in; height: 5.075in; object-fit: fill; border-radius: .1875in; }
.overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.title { font-size: 31px; font-weight: 800; fill: #24465d; letter-spacing: -.5px; }
.subtitle { font-size: 15px; font-weight: 500; fill: #526b78; }
.kicker { font-size: 14px; font-weight: 800; fill: #315bce; letter-spacing: 1.5px; }
.tag { font-size: 16px; font-weight: 800; fill: #29495f; }
.minor { font-size: 13px; font-weight: 600; fill: #586c78; }

.role-desc { font-size: 11px; font-weight: 700; fill: #5b6e78; }
.stage-name { font-size: 14px; font-weight: 800; fill: #29495f; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.stage-index { font-size: 14px; font-weight: 800; fill: #315bce; }
.future-title { font-size: 14px; font-weight: 800; fill: #94631d; letter-spacing: .45px; }
.future-copy { font-size: 12px; font-weight: 700; fill: #526b78; }
.state { font-size: 14px; font-weight: 800; fill: #29495f; }
.card { fill: #fffdf8; fill-opacity: .95; stroke: #24465d; stroke-width: 2; }
.trail-under { fill: none; stroke: #fff1c9; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.stage-path { fill: none; stroke: #315bce; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
.rollback-path { fill: none; stroke: #c66c2d; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; }
.rejected-path { fill: none; stroke: #b94f49; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; }
.data-path { fill: none; stroke: #8665a5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; }
</style>

<body>
<main class="figure">

    <title id="title">Dense Intelligence Across the Horizon</title>

    <g filter="url(#shadow)"><rect x="540" y="376" width="172" height="70" rx="15" class="card"/><image href="assets/anime/engineer.png" x="548" y="380" width="62" height="62" preserveAspectRatio="xMidYMid meet"/><text x="660" y="407" text-anchor="middle" class="role-title">ENGINEER</text><text x="660" y="428" text-anchor="middle" class="role-desc">build</text></g>
    <g filter="url(#shadow)"><rect x="393" y="286" width="172" height="70" rx="15" class="card"/><image href="assets/anime/reviewer.png" x="401" y="290" width="62" height="62" preserveAspectRatio="xMidYMid meet"/><text x="513" y="317" text-anchor="middle" class="role-title">REVIEWER</text><text x="513" y="338" text-anchor="middle" class="role-desc">review</text></g>
    </g>

    <g transform="translate(0 -70)">

    <text x="1660" y="341" text-anchor="middle" class="future-copy">Current runtime: fixed model</text>

    <g>
      <g><circle cx="820" cy="665" r="20" fill="#fffdf8" stroke="#315bce" stroke-width="4"/><text x="820" y="670" text-anchor="middle" class="stage-index">1</text><text x="850" y="650" class="stage-name">Research</text></g>
