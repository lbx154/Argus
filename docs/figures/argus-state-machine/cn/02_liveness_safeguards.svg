<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><polygon points="0,0 10,5 0,10" fill="#228833"/></marker>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBFCFE"/>

  <g id="header" data-pptx-bounds="40 24 1200 84">
    <rect x="40" y="29" width="7" height="38" rx="3.5" fill="#228833"/>
    <text x="61" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#25364A">活性保护图谱：13 个风险如何被关闭</text>
    <text x="61" y="91" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#25364A">每个原死锁或活锁分量都获得确定退出机制；重复失败不能无限消耗模型预算。</text>
    <text x="1240" y="43" text-anchor="end" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#228833">FIG. 2 · LIVENESS CLOSURE</text>
    <line x1="1055" y1="58" x2="1240" y2="58" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1240" y="82" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#25364A">原风险（红）→ 保护器（蓝/紫）→ 安全终态（绿）</text>
  </g>

