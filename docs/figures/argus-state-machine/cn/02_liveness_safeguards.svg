    <text x="162" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#25364A">DAG validate</text>
    <line x1="162" y1="254" x2="162" y2="274" stroke="#228833" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="74" y="282" width="176" height="44" rx="7" fill="#FBFCFE" stroke="#228833" stroke-width="1.5"/>
    <text x="162" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#25364A">reconcile → ready</text>
    <line x1="162" y1="326" x2="162" y2="346" stroke="#228833" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="74" y="354" width="176" height="44" rx="7" fill="#FBFCFE" stroke="#228833" stroke-width="1.5"/>
    <text x="162" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#25364A">execute → review</text>
    <line x1="162" y1="398" x2="162" y2="418" stroke="#228833" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="74" y="426" width="176" height="44" rx="7" fill="#FBFCFE" stroke="#AA3377" stroke-width="1.5"/>
    <text x="162" y="454" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#25364A">Manager decision</text>
    <line x1="162" y1="470" x2="162" y2="490" stroke="#228833" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="74" y="498" width="176" height="52" rx="7" fill="#228833" fill-opacity="0.08" stroke="#228833" stroke-width="2"/>
    <text x="162" y="520" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#228833">安全终态</text>
    <text x="162" y="540" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#25364A">done | skipped | failed | human</text>

    <text x="60" y="578" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#228833">统一条件</text>
    <text x="60" y="598" font-family="Consolas, monospace" font-size="13" fill="#228833">pending ⇒ successor ∨ terminal</text>
  </g>

  <g id="p0-closures" data-pptx-bounds="310 122 430 486">
    <rect x="310" y="122" width="430" height="486" rx="10" fill="#FBFCFE" stroke="#228833" stroke-width="2"/>
    <rect x="310" y="122" width="430" height="42" rx="9" fill="#228833" fill-opacity="0.08"/>
    <text x="330" y="151" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#228833">P0 CLOSED</text>
    <text x="472" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">永久不可执行路径 → fail-closed</text>

    <text x="330" y="190" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#EE6677">P0-1 · DAG 环</text>
    <text x="450" y="190" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">写入前拒绝；遗留 SCC → skipped</text>
    <text x="330" y="211" font-family="Consolas, monospace" font-size="13" fill="#228833">cycle → ValueError | terminal skip</text>
    <line x1="330" y1="226" x2="720" y2="226" stroke="#CBD5E1" stroke-width="1"/>

    <text x="330" y="255" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#EE6677">P0-2 · cleanup</text>
    <text x="470" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">两个调度入口共享 reconciliation</text>
    <text x="330" y="276" font-family="Consolas, monospace" font-size="13" fill="#228833">next_pending ≡ claim_next preflight</text>
    <line x1="330" y1="291" x2="720" y2="291" stroke="#CBD5E1" stroke-width="1"/>

    <text x="330" y="320" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#EE6677">P0-3 · replan</text>
    <text x="470" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">版本化 CAS 原子替换</text>
    <text x="330" y="341" font-family="Consolas, monospace" font-size="13" fill="#228833">expected[v] → commit[v+1]</text>
    <line x1="330" y1="356" x2="720" y2="356" stroke="#CBD5E1" stroke-width="1"/>

    <text x="330" y="385" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#EE6677">P0-4 · 空 replacement</text>
    <text x="510" y="385" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">三次熔断</text>
    <text x="330" y="406" font-family="Consolas, monospace" font-size="13" fill="#228833">filtered × 3 → node failed</text>
    <line x1="330" y1="421" x2="720" y2="421" stroke="#CBD5E1" stroke-width="1"/>

    <text x="330" y="450" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#EE6677">P0-5 · pause</text>
    <text x="450" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">外部条件恢复后自动新 attempt</text>
    <text x="330" y="471" font-family="Consolas, monospace" font-size="13" fill="#228833">budget/provider/daemon → attempt+1</text>
    <line x1="330" y1="486" x2="720" y2="486" stroke="#CBD5E1" stroke-width="1"/>

    <text x="330" y="515" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#EE6677">P0-6 · answer</text>
    <text x="460" y="515" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#25364A">原子重接所有活跃下游依赖</text>
    <text x="330" y="536" font-family="Consolas, monospace" font-size="13" fill="#228833">old failed ID → continuation ID</text>
    <rect x="330" y="558" width="390" height="30" rx="6" fill="#228833" fill-opacity="0.08" stroke="#228833" stroke-width="1"/>
    <text x="525" y="578" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#228833">结果：P0 分量均无法保持 pending 闭环</text>
  </g>

