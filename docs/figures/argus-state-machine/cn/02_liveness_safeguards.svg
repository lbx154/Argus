    <text x="780" y="494" font-family="Consolas, monospace" font-size="13" fill="#228833">signature += context hash</text>
    <text x="780" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#25364A">证据变化即新 acceptance unit</text>

