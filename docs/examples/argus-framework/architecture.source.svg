<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 982">
<title>Argus: campaign control, reviewed execution and reusable domain knowledge</title>
<desc>Based on the current Argus implementation and technical report. The Manager commits intent and stage policy; the Planner defines bounded tasks and dependencies; LifeSupervisor schedules durable missions. The Engineer uses real tools and produces artifacts for an independent Reviewer. Outcomes return to campaign scheduling, while continue repairs the current mission and plan challenges go to the Manager. Shared Skill/Wiki memory, vertical contracts, runner backends and durable records support these roles. The Research vertical requires independent review and invokes SVG drawing only when Paper needs a figure.</desc>
