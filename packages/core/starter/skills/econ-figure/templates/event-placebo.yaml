# Two panels side by side: dynamic effects and the placebo distribution, a common pairing for a DID paper.
figure:
  language: zh
  width_pt: 455.24
  layout: [1, 2]
  height_ratio: 0.42
panels:
  - archetype: event-study
    data: data/event_study.csv
    subtitle: 动态效应
    series: {twfe: 双向固定效应, sa: Sun–Abraham}
    binned_ends: true
    xlabel: 相对试点的年份 $k$
    ylabel: 估计系数
    legend: upper left
  - archetype: distribution
    data: data/placebo.csv
    subtitle: 安慰剂检验
    actual: 0.064
    actual_label: 实际估计值
    xlabel: 随机处理组的估计系数
    ylabel: 频数
