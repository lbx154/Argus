name: desktop

# The desktop app with the Argus it ships: packages/core, run with the
# system's Node.js. On each host it ships to: an unsigned installer built
# from this commit, the desktop's tests (among them the shipped Argus started
# with Node, as the app starts it) and its UI tests on Windows.

on:
  workflow_dispatch:
  # A change pushed straight to dev or to the TypeScript core's branches is
  # checked too, not only one in a PR.
  push:
    branches: [dev, 'feat/ts-core*']
    paths:
      - 'desktop-tauri/**'
      - 'packages/**'
      - 'frontend/web/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'packages/**'
      - 'frontend/web/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop · ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15
            platform: darwin-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/web/package-lock.json
            desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # The warm dependency cache desktop-cache.yml keeps for each target.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
          shared-key: desktop-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Install
        run: |
          npm ci
          npm --prefix frontend/web ci
          npm --prefix desktop-tauri ci
      - name: Build an unsigned installer with the Argus it ships
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm --prefix desktop-tauri run build:unsigned
      - name: Test the desktop
        run: |
          npm --prefix desktop-tauri run ui:typecheck
          npm --prefix desktop-tauri run test:copy
          npm --prefix desktop-tauri run test:release
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --release --lib --test core_tests
      - name: Test compatible-product storage without importing Argus state
        env:
          ARGUS_DESKTOP_PROFILE: compatibleapp
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --release --test core_tests 'settings::tests::'
      - name: Test the desktop UI
        if: runner.os == 'Windows'
        run: npm --prefix desktop-tauri run test:ui -- tests/shell.spec.ts
      - name: The installer carries Argus
        run: |
          bundle=desktop-tauri/src-tauri/target/release/bundle
          case "$RUNNER_OS" in
            macOS) test -f "$(ls -d $bundle/macos/*.app)/Contents/Resources/argus/dist/argus.mjs"
                   test -f "$(ls -d $bundle/macos/*.app)/Contents/Resources/argus/web/index.html" ;;
            Linux) dpkg-deb -c $bundle/deb/*.deb | grep -q 'argus/dist/argus.mjs$'
                   dpkg-deb -c $bundle/deb/*.deb | grep -q 'argus/web/index.html$' ;;
            Windows) 7z l "$(ls $bundle/nsis/*.exe)" | grep -q 'argus.dist.argus\.mjs' ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: argus-desktop-${{ matrix.platform }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
