name: tests

# One check on every push and pull request: lint, then the whole pytest suite
# in parallel on Linux. Linux is the development platform and this job is the
# one that decides whether a change is green.
#
# Everything else -- the mypy type gate, the platform-portability, frontend
# and Windows desktop-package checks -- lives in extended.yml and runs only on
# demand (workflow_dispatch): before a release, or when a change touches the
# chat bridges, the pairing/QR path, the cockpits or the Tauri host.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        # The project's own dev extra, rather than a hand-listed subset that
        # drifts. The community verticals (argus-verticals) and their heavy
        # scientific stack are not installed here: this suite tests the
        # framework and its seven built-in verticals only.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,qr,trial]'
      - name: Lint
        run: python -m ruff check argus argus_skill tests
      - name: Test
        run: python -m pytest -q -n auto
