name: tests

# The TypeScript runtime on all supported hosts.
# The TypeScript job also checks the existing frontend contract consumers.
#
# The web cockpit's own tests live in extended.yml and run only on demand
# (workflow_dispatch).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typescript · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check existing frontend consumers
        if: runner.os == 'Linux'
        run: |
          npm --prefix frontend/web ci
          npm --prefix frontend/web run typecheck
