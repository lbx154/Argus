name: tests

# Argus is developed on Linux, but it is installed on laptops. Without CI on
# the other two platforms, portability regressions are only found by users —
# and some are invisible on Linux by construction (a Windows console uses the
# ANSI code page, so text that prints fine here raises UnicodeEncodeError
# there).
#
# Coverage is deliberately asymmetric, because the runtime itself is not fully
# portable today: the subagent pool uses ``os.fork`` and cross-process locking
# uses ``fcntl``, neither of which exists on Windows. Running the whole suite
# there would be red on arrival and tell us nothing. So:
#
#   * Linux           — the full suite; this is the development platform.
#   * macOS + Windows — the portable surface that must work everywhere:
#                       the chat bridges, the pairing/QR path, and the core
#                       helpers behind them.
#   * Windows Desktop — the Tauri/Rust host, frozen backend, and unsigned
#                       package layout used before release signing.
#
# Widen PORTABLE_TESTS as modules become platform-clean.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Modules that must pass on every platform.
  PORTABLE_TESTS: >-
    tests/life/test_chat_render.py
    tests/life/test_feishu_bot.py
    tests/life/test_state_machine_guards.py
    tests/life/test_telegram_bot.py
    tests/life/test_telegram_mobile.py
    tests/core/test_release.py
    tests/core/test_file_lock.py
    tests/core/test_daemon_lock.py
    tests/core/test_session_lock_portable.py
    tests/daemon/test_state_portable.py
    tests/test_idle_watchdog.py
    tests/test_run_exec_stream_callback.py
    tests/test_stop_kind_lifecycle.py
    tests/tools/test_lean_check.py
    tests/webapi/test_manager_rotation.py
    tests/webapi/test_pairing.py

  # Product paths whose Windows behavior is exercised by the Desktop host.
  WINDOWS_CORE_TESTS: >-
    tests/apps/test_cli_parser.py
    tests/apps/test_tui_launcher.py
    tests/daemon/test_health.py
    tests/daemon/test_process_workspace.py
    tests/daemon/test_spawn_admission_portable.py
    tests/daemon/test_spawn_helper.py
    tests/daemon/test_windows_daemon_control.py
    tests/daemon/test_windows_terminal_process.py
    tests/core/test_agent_probe.py
    tests/core/test_backend_readiness.py
    tests/core/test_cheap_route_models.py
    tests/maintenance/test_repair_pipeline.py
    tests/maintenance/test_doctor_advisor.py
    tests/test_agent_cli_backend.py
    tests/test_bootstrap_doctor.py
    tests/test_doctor.py
    tests/test_install_documentation.py
    tests/tools/test_setup_readiness.py
    tests/webapi/test_commands_m1.py
    tests/webapi/test_server_m0.py
    tests/webapi/test_workspace_v2.py

  # These modules must remain collectable on Windows even when individual
  # POSIX-only assertions are reported as skipped.
  WINDOWS_COLLECTION_TESTS: >-
    tests/core/test_file_lock.py
    tests/core/test_daemon_lock.py
    tests/daemon/test_life_worker.py
    tests/manager/test_live_view.py
    tests/manager/test_manager_session.py
    tests/test_manager_session_lock.py
    tests/test_engineer_sandbox.py

jobs:
  linux:
    name: linux · full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        # The project's own dev extra, rather than a hand-listed subset that
        # drifts: the full suite exercises the quant vertical, which needs
        # matplotlib, mplfinance, scikit-learn, lightgbm and torch. CPU torch
        # is installed first so the dev extra resolves against it instead of
        # pulling the multi-gigabyte CUDA build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,qr]'
      - name: Lint
        run: python -m ruff check argus_skill tests
      - name: Test
        run: python -m pytest -q

  portable:
    name: ${{ matrix.os }} · portable surface
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[qr]'
          python -m pip install pytest
      - name: Test portable surface
        run: python -m pytest -q ${{ env.PORTABLE_TESTS }}

      - uses: astral-sh/setup-uv@v5
        if: runner.os == 'macOS'
      - name: Smoke macOS uv tool install
        if: runner.os == 'macOS'
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/argus-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/argus-bin"
          uv tool install --python 3.12 .
          "$UV_TOOL_BIN_DIR/argus-skill" --version
          "$UV_TOOL_BIN_DIR/argus" --help

      - name: Smoke Windows direct pip install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip uninstall -y argus-skill
          python -m pip install --no-deps (Get-ChildItem dist\*.whl).FullName
          argus-skill --version
          argus --help

      # The pairing banner is written to stderr, which on Windows uses the ANSI
      # code page (cp1252/cp936) whenever output is redirected — not UTF-8.
      # Printing a QR code there used to raise UnicodeEncodeError and abort
      # `--web` outright, and no amount of Linux testing would show it. Assert
      # the real redirected path, not just the unit tests.
      - name: Pairing banner survives a redirected console
        shell: bash
        run: |
          python -c "
          import sys
          from argus_skill.webapi.pairing import pairing_plan
          plan = pairing_plan('0.0.0.0', 8799, lan_address='192.168.1.50')
          sys.stderr.write(plan.banner)
          assert plan.url.startswith('http://192.168.1.50:8799/?token='), plan.url
          print('pairing banner OK on', sys.platform, '/', sys.stderr.encoding)
          " > banner.log 2>&1
          cat banner.log

  frontend:
    name: frontend · web + cockpit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
      - name: Typecheck web
        run: npm --prefix frontend/web run typecheck
      - name: Test web
        run: npm --prefix frontend/web test
      - name: Test cockpit
        run: npm --prefix frontend/tui test

  desktop:
    name: windows · Tauri desktop package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            desktop-tauri/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff "httpx2>=2.9,<3" "pyinstaller>=6.11,<7"
          npm --prefix frontend/web ci
          npm --prefix desktop-tauri ci
      - name: Lint and test desktop sources
        run: |
          python -m ruff check argus_skill desktop-tauri/scripts tests/desktop
          python -m pytest -q tests/desktop/test_frozen_runtime.py
          python -m pytest -q tests/desktop/test_native_window_chrome.py
          python -m pytest --collect-only -q ${{ env.WINDOWS_COLLECTION_TESTS }}
          python -m pytest -q ${{ env.WINDOWS_CORE_TESTS }}
          npm --prefix desktop-tauri run ui:typecheck
          cargo check --manifest-path desktop-tauri/src-tauri/Cargo.toml
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --test core_tests
      - name: Build frozen backend and unsigned Tauri package layout
        shell: pwsh
        run: |
          ./desktop-tauri/scripts/build-backend.ps1 -SkipInstall
          npm --prefix frontend/web run build
          npm --prefix desktop-tauri run build:unsigned
