name: windows issue reproduction
on:
  workflow_dispatch:
jobs:
  windows-reproduction:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Reproduce owned descendant leak before the fix
        run: python -m pytest -q tests/agent_cli/test_windows_turn_ownership.py --junitxml=windows-reproduction.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reproduction
          path: windows-reproduction.xml
