name: CI

on:
  push:
  pull_request:

jobs:
  python-quality-gates:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Run lint
        run: ruff check .

      - name: Run type check
        run: mypy argus_skill tests

      - name: Run bytecode check
        run: python -m compileall -q argus_skill tests

      - name: Run benchmark results validator
        run: python -m benchmarks.validate_results benchmarks/results

      - name: Run CLI smoke check
        run: python -m argus_skill --help >/dev/null

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Install built wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/argus-skill --help >/dev/null
          # Import + load builtin skills from the INSTALLED package (run from /
          # so the source tree is not on sys.path), proving data files shipped.
          cd / && /tmp/wheel-venv/bin/python -c "import argus_skill, os; assert 'site-packages' in os.path.dirname(argus_skill.__file__); from argus_skill.skills.builtins import builtin_skill_count; assert builtin_skill_count() >= 50, builtin_skill_count()"
