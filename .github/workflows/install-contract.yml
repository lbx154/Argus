name: Install and backend contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base distribution and focused test tools
        run: python -m pip install --upgrade pip build pytest packaging -e .
      - name: Run install, Pi, planner-repair, and release contracts
        run: |
          python -m pytest -q \
            tests/scripts/test_build_release.py \
            tests/scripts/test_install_contract.py \
            tests/scripts/test_materialize_npm_release.py \
            tests/scripts/test_verify_binary.py \
            tests/core/test_backend_readiness.py \
            tests/planner/test_bounded_dag.py \
            tests/test_pi_backend.py \
            tests/test_reviewer_named_contract.py \
            tests/apps/test_tui_launcher.py \
            tests/core/test_release.py
      - name: Build and smoke a clean wheel install
        run: |
          python -m build --wheel --outdir dist-wheel
          python scripts/verify_wheel.py dist-wheel/*.whl
