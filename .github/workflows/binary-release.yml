name: Binary beta release
run-name: Argus ${{ inputs.version }} · ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Commit-derived version, for example 0.1.1-beta.g7931dd58120d
        required: true
        type: string
      source_sha:
        description: Exact 40-character origin/main commit to build
        required: true
        type: string
      publish:
        description: Publish the audited tarballs to npm
        required: true
        default: false
        type: boolean
      confirm:
        description: Type PUBLISH @argusevolve/argus VERSION when publishing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-binary-beta-release
  cancel-in-progress: false

jobs:
  backend-compat:
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        codex-version: ["0.128.0", "0.144.5"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install source fallback and Codex compatibility target
        run: |
          python -m pip install -e .
          npm install -g @openai/codex@${{ matrix.codex-version }}
      - name: Verify supported Codex version without mutating auth
        run: |
          python - <<'PY'
          from argus_skill.core.backend_readiness import check_backend_readiness
          report = check_backend_readiness(
              "codex",
              "subscription_cli",
              probe_auth=False,
          )
          assert report.ok, report.problems
          print(report.version)
          PY

  pi-compat:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install source fallback and tested Pi CLI
        run: |
          python -m pip install -e .
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.83.0
      - name: Verify Pi JSON-stream compatibility without a model call
        run: |
          python - <<'PY'
          from argus_skill.core.backend_readiness import check_backend_readiness
          report = check_backend_readiness(
              "pi",
              "subscription_cli",
              probe_auth=False,
          )
          assert report.ok, report.problems
          print(report.version)
          PY

  platform:
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on glibc 2.35 for broader Linux compatibility.
          - os: ubuntu-22.04
            platform: linux
            binary: argus-core
          - os: windows-2022
            platform: win32
            binary: argus-core.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARGUS_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify pinned source and commit-derived version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - "$RELEASE_VERSION" "$SOURCE_SHA" <<'PY'
          import re
          import sys
          version, source_sha = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_sha must be 40 lowercase hex characters")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-beta\.g[0-9a-f]{12}", version):
              raise SystemExit("version is not commit-derived beta SemVer")
          if not version.endswith("g" + source_sha[:12]):
              raise SystemExit("version commit suffix does not match source_sha")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set immutable beta build version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/set_binary_release_version.py "$RELEASE_VERSION"

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend/web
          npm ci --prefix frontend/tui

      - name: Build production frontends
        run: |
          npm run build --prefix frontend/web
          npm run build --prefix frontend/tui

      - name: Install binary build dependencies
        run: python -m pip install --upgrade pip '.[binary]' pytest build

      - name: Scan only shipped inputs for credentials
        run: python scripts/scan_binary_release_inputs.py

      - name: Run binary release tests
        run: |
          python -m pytest -q \
            tests/core/test_release.py \
            tests/core/test_backend_readiness.py \
            tests/apps/test_tui_launcher.py \
            tests/daemon/test_windows_terminal_process.py \
            tests/tools/test_setup_readiness.py \
            tests/scripts/test_build_release.py \
            tests/scripts/test_install_contract.py \
            tests/scripts/test_materialize_npm_release.py \
            tests/scripts/test_prepare_npm_binary_packages.py \
            tests/scripts/test_verify_binary.py \
            tests/test_pi_backend.py \
            tests/tools/test_verify_npm_tarballs.py
          npm test --prefix frontend/web
          npm test --prefix frontend/tui

      - name: Verify a clean wheel install and its WebAPI
        if: ${{ matrix.platform == 'linux' }}
        run: |
          python -m build --wheel --outdir dist-wheel
          python scripts/verify_wheel.py dist-wheel/*.whl

      - name: Build and verify executable
        run: |
          python scripts/build_binary.py
          python scripts/verify_binary.py dist-binary/${{ matrix.binary }}

      - name: Prepare isolated npm staging directories
        run: |
          python scripts/prepare_npm_binary_packages.py \
            --binary dist-binary/${{ matrix.binary }} \
            --platform ${{ matrix.platform }} \
            --arch x64 \
            --notices dist-binary/THIRD_PARTY_NOTICES.txt \
            --version '${{ inputs.version }}'
          python scripts/verify_npm_binary_packages.py

      - name: Pack and audit exact npm tarballs
        run: |
          mkdir -p dist-binary/packs
          npm pack \
            --pack-destination dist-binary/packs \
            dist-binary/npm/argus-${{ matrix.platform }}-x64
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npm pack \
              --pack-destination dist-binary/packs \
              dist-binary/npm/argus
          fi
          python scripts/verify_npm_tarballs.py dist-binary/packs/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.platform }}-x64
          if-no-files-found: error
          path: |
            dist-binary/${{ matrix.binary }}
            dist-binary/${{ matrix.binary }}.sha256
            dist-binary/THIRD_PARTY_NOTICES.txt
            dist-binary/packs/*.tgz

  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish }}
    needs: [platform, backend-compat, pi-compat]
    runs-on: ubuntu-22.04
    environment: npm-beta
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARGUS_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify pinned release source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.5.1

      - name: Require explicit owner confirmation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
        run: |
          test "$ACTOR" = "lbx154"
          test "$CONFIRM" = "PUBLISH @argusevolve/argus $RELEASE_VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: argus-linux-x64
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: argus-win32-x64
          path: release/windows

      - name: Re-audit downloaded release tarballs
        run: |
          python scripts/verify_npm_tarballs.py \
            release/linux/packs/*.tgz \
            release/windows/packs/*.tgz

      - name: Refuse a conflicting GitHub release or tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists" >&2
            exit 1
          fi
          remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "tag $tag points to $remote_sha instead of $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Publish or recover canonical npm tarballs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          linux_tarball=$(find release/linux/packs -name "argusevolve-argus-$RELEASE_VERSION-linux-x64.tgz" -print -quit)
          windows_tarball=$(find release/windows/packs -name "argusevolve-argus-$RELEASE_VERSION-win32-x64.tgz" -print -quit)
          argus_tarball=$(find release/linux/packs -name "argusevolve-argus-$RELEASE_VERSION.tgz" -print -quit)
          test -n "$linux_tarball"
          test -n "$windows_tarball"
          test -n "$argus_tarball"
          mkdir -p release/canonical/{linux,windows,main}

          integrity() {
            python - "$1" <<'PY'
          import base64
          import hashlib
          import pathlib
          import sys
          payload = pathlib.Path(sys.argv[1]).read_bytes()
          print("sha512-" + base64.b64encode(hashlib.sha512(payload).digest()).decode())
          PY
          }

          canonicalize() {
            local_tarball=$1
            version=$2
            tag=$3
            destination=$4
            if npm view "@argusevolve/argus@$version" version >/dev/null 2>&1; then
              # Immutable version already exists after a partial release. Fetch
              # the registry's exact bytes; a fresh PyInstaller rebuild is not
              # reproducible and must never replace the canonical artifact.
              npm pack "@argusevolve/argus@$version" \
                --pack-destination "$destination" >&2
            else
              npm publish "$local_tarball" --access public --tag "$tag" >&2
              cp "$local_tarball" "$destination/"
            fi
            canonical=$(find "$destination" -maxdepth 1 -name '*.tgz' -print)
            test "$(printf '%s\n' "$canonical" | grep -c .)" = 1
            expected=$(integrity "$canonical")
            actual=""
            for attempt in $(seq 1 12); do
              actual=$(npm view "@argusevolve/argus@$version" dist.integrity 2>/dev/null || true)
              [ -n "$actual" ] && break
              sleep 5
            done
            test "$expected" = "$actual" || {
              echo "registry integrity mismatch for @argusevolve/argus@$version" >&2
              exit 1
            }
          }

          canonicalize "$linux_tarball" "$RELEASE_VERSION-linux-x64" linux-x64 release/canonical/linux
          canonicalize "$windows_tarball" "$RELEASE_VERSION-win32-x64" win32-x64 release/canonical/windows
          canonicalize "$argus_tarball" "$RELEASE_VERSION" beta release/canonical/main
          python scripts/verify_npm_tarballs.py release/canonical/*/*.tgz

          wait_for_tag() {
            tag=$1
            expected=$2
            for attempt in $(seq 1 12); do
              actual=$(npm view "@argusevolve/argus" "dist-tags.$tag" 2>/dev/null || true)
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              echo "waiting for npm dist-tag $tag ($attempt/12): got '$actual', want '$expected'"
              sleep 5
            done
            echo "npm dist-tag $tag did not converge to $expected" >&2
            return 1
          }

          wait_for_tag linux-x64 "$RELEASE_VERSION-linux-x64"
          wait_for_tag win32-x64 "$RELEASE_VERSION-win32-x64"
          wait_for_tag beta "$RELEASE_VERSION"
          python scripts/materialize_npm_release.py \
            --version "$RELEASE_VERSION" \
            --output release/assets \
            release/canonical/*/*.tgz

      - name: Prepare GitHub Release metadata and notes
        id: release_meta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/set_binary_release_version.py "$RELEASE_VERSION"
          release_id=$(python -c 'import json; print(json.load(open("argus_skill/release_manifest.json"))["release_id"])')
          source_digest=$(python -c 'import json; print(json.load(open("argus_skill/release_manifest.json"))["source_digest"])')
          python_distribution_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$RELEASE_VERSION"

          cat > release/notes.md <<EOF
          ## Argus binary beta

          - Version: \`$RELEASE_VERSION\`
          - Commit: \`$SOURCE_SHA\`
          - Release identity: \`$release_id\`
          - npm: \`@argusevolve/argus@$RELEASE_VERSION\`
          - Platforms: Linux x64 and Windows x64

          ### Install

          \`\`\`bash
          npm install -g @argusevolve/argus@beta
          \`\`\`

          The attached binaries were materialized from the exact immutable npm
          tarballs. A partial-release retry therefore reuses registry bytes
          instead of attaching a non-reproducible rebuild.
          EOF

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "python_distribution_version=$python_distribution_version" >> "$GITHUB_OUTPUT"

      - name: Write auditable release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ID: ${{ steps.release_meta.outputs.release_id }}
          SOURCE_DIGEST: ${{ steps.release_meta.outputs.source_digest }}
          PYTHON_DISTRIBUTION_VERSION: ${{ steps.release_meta.outputs.python_distribution_version }}
        run: |
          export NPM_LINUX_INTEGRITY=$(npm view "@argusevolve/argus@$RELEASE_VERSION-linux-x64" dist.integrity)
          export NPM_WINDOWS_INTEGRITY=$(npm view "@argusevolve/argus@$RELEASE_VERSION-win32-x64" dist.integrity)
          export NPM_MAIN_INTEGRITY=$(npm view "@argusevolve/argus@$RELEASE_VERSION" dist.integrity)
          export LINUX_SHA256=$(awk '{print $1}' "release/assets/argus-$RELEASE_VERSION-linux-x64.sha256")
          export WINDOWS_SHA256=$(awk '{print $1}' "release/assets/argus-$RELEASE_VERSION-win32-x64.exe.sha256")
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          payload = {
              "schema_version": 1,
              "version": version,
              "source_sha": os.environ["SOURCE_SHA"],
              "source_digest": os.environ["SOURCE_DIGEST"],
              "release_id": os.environ["RELEASE_ID"],
              "python_distribution_version": os.environ[
                  "PYTHON_DISTRIBUTION_VERSION"
              ],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "npm": {
                  "package": "@argusevolve/argus",
                  "versions": {
                      "main": version,
                      "linux_x64": f"{version}-linux-x64",
                      "win32_x64": f"{version}-win32-x64",
                  },
                  "integrity": {
                      "main": os.environ["NPM_MAIN_INTEGRITY"],
                      "linux_x64": os.environ["NPM_LINUX_INTEGRITY"],
                      "win32_x64": os.environ["NPM_WINDOWS_INTEGRITY"],
                  },
              },
              "assets_sha256": {
                  f"argus-{version}-linux-x64": os.environ["LINUX_SHA256"],
                  f"argus-{version}-win32-x64.exe": os.environ["WINDOWS_SHA256"],
              },
          }
          Path("release/assets/release-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub prerelease from the audited assets
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Argus $RELEASE_TAG" \
            --notes-file release/notes.md \
            --prerelease \
            release/assets/*
