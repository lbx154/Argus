name: Binary beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable beta version, for example 0.1.1-beta.1
        required: true
        type: string
      publish:
        description: Publish the audited tarballs to npm
        required: true
        default: false
        type: boolean
      confirm:
        description: Type PUBLISH @argusevolve/argus VERSION when publishing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-binary-beta-release
  cancel-in-progress: false

jobs:
  platform:
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on glibc 2.35 for broader Linux compatibility.
          - os: ubuntu-22.04
            platform: linux
            binary: argus-core
          - os: windows-2022
            platform: win32
            binary: argus-core.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set immutable beta build version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/set_binary_release_version.py "$RELEASE_VERSION"

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend/web
          npm ci --prefix frontend/tui

      - name: Build production frontends
        run: |
          npm run build --prefix frontend/web
          npm run build --prefix frontend/tui

      - name: Install binary build dependencies
        run: python -m pip install --upgrade pip '.[binary]' pytest

      - name: Scan only shipped inputs for credentials
        run: python scripts/scan_binary_release_inputs.py

      - name: Run binary release tests
        run: |
          python -m pytest -q \
            tests/core/test_release.py \
            tests/apps/test_tui_launcher.py \
            tests/daemon/test_windows_terminal_process.py \
            tests/scripts/test_prepare_npm_binary_packages.py \
            tests/tools/test_verify_npm_tarballs.py
          npm test --prefix frontend/web
          npm test --prefix frontend/tui

      - name: Build and verify executable
        run: |
          python scripts/build_binary.py
          python scripts/verify_binary.py dist-binary/${{ matrix.binary }}

      - name: Prepare isolated npm staging directories
        run: |
          python scripts/prepare_npm_binary_packages.py \
            --binary dist-binary/${{ matrix.binary }} \
            --platform ${{ matrix.platform }} \
            --arch x64 \
            --notices dist-binary/THIRD_PARTY_NOTICES.txt \
            --version '${{ inputs.version }}'
          python scripts/verify_npm_binary_packages.py

      - name: Pack and audit exact npm tarballs
        run: |
          mkdir -p dist-binary/packs
          npm pack \
            --pack-destination dist-binary/packs \
            dist-binary/npm/argus-${{ matrix.platform }}-x64
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npm pack \
              --pack-destination dist-binary/packs \
              dist-binary/npm/argus
          fi
          python scripts/verify_npm_tarballs.py dist-binary/packs/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.platform }}-x64
          if-no-files-found: error
          path: |
            dist-binary/${{ matrix.binary }}
            dist-binary/${{ matrix.binary }}.sha256
            dist-binary/THIRD_PARTY_NOTICES.txt
            dist-binary/packs/*.tgz

  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish }}
    needs: platform
    runs-on: ubuntu-22.04
    environment: npm-beta
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.5.1

      - name: Require explicit owner confirmation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
        run: |
          test "$ACTOR" = "lbx154"
          test "$CONFIRM" = "PUBLISH @argusevolve/argus $RELEASE_VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: argus-linux-x64
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: argus-win32-x64
          path: release/windows

      - name: Re-audit downloaded release tarballs
        run: |
          python scripts/verify_npm_tarballs.py \
            release/linux/packs/*.tgz \
            release/windows/packs/*.tgz

      - name: Refuse a conflicting GitHub release or tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists" >&2
            exit 1
          fi
          remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "tag $tag points to $remote_sha instead of $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Prepare GitHub Release metadata and assets
        id: release_meta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/set_binary_release_version.py "$RELEASE_VERSION"
          release_id=$(python -c 'import json; print(json.load(open("argus_skill/release_manifest.json"))["release_id"])')
          tag="v$RELEASE_VERSION"
          mkdir -p release/assets

          linux_name="argus-$RELEASE_VERSION-linux-x64"
          windows_name="argus-$RELEASE_VERSION-win32-x64.exe"
          cp release/linux/argus-core "release/assets/$linux_name"
          cp release/windows/argus-core.exe "release/assets/$windows_name"
          chmod +x "release/assets/$linux_name"
          linux_digest=$(awk '{print $1}' release/linux/argus-core.sha256)
          windows_digest=$(awk '{print $1}' release/windows/argus-core.exe.sha256)
          printf '%s  %s\n' "$linux_digest" "$linux_name" > "release/assets/$linux_name.sha256"
          printf '%s  %s\n' "$windows_digest" "$windows_name" > "release/assets/$windows_name.sha256"
          cp release/linux/THIRD_PARTY_NOTICES.txt release/assets/THIRD_PARTY_NOTICES-linux.txt
          cp release/windows/THIRD_PARTY_NOTICES.txt release/assets/THIRD_PARTY_NOTICES-windows.txt

          cat > release/notes.md <<EOF
          ## Argus binary beta

          - Version: \`$RELEASE_VERSION\`
          - Commit: \`$GITHUB_SHA\`
          - Release identity: \`$release_id\`
          - npm: \`@argusevolve/argus@$RELEASE_VERSION\`
          - Platforms: Linux x64 and Windows x64

          ### Install

          \`\`\`bash
          npm install -g @argusevolve/argus@beta
          \`\`\`

          This prerelease was built, tested, packaged, and audited by the same
          GitHub Actions run that published the npm beta.
          EOF

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish or verify audited npm tarballs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          linux_tarball=$(find release/linux/packs -name "argusevolve-argus-$RELEASE_VERSION-linux-x64.tgz" -print -quit)
          windows_tarball=$(find release/windows/packs -name "argusevolve-argus-$RELEASE_VERSION-win32-x64.tgz" -print -quit)
          argus_tarball=$(find release/linux/packs -name "argusevolve-argus-$RELEASE_VERSION.tgz" -print -quit)
          test -n "$linux_tarball"
          test -n "$windows_tarball"
          test -n "$argus_tarball"

          integrity() {
            python - "$1" <<'PY'
          import base64
          import hashlib
          import pathlib
          import sys
          payload = pathlib.Path(sys.argv[1]).read_bytes()
          print("sha512-" + base64.b64encode(hashlib.sha512(payload).digest()).decode())
          PY
          }

          publish_or_verify() {
            tarball=$1
            version=$2
            tag=$3
            if npm view "@argusevolve/argus@$version" version >/dev/null 2>&1; then
              expected=$(integrity "$tarball")
              actual=$(npm view "@argusevolve/argus@$version" dist.integrity)
              test "$expected" = "$actual" || {
                echo "published integrity mismatch for @argusevolve/argus@$version" >&2
                exit 1
              }
              echo "verified existing @argusevolve/argus@$version"
            else
              npm publish "$tarball" --access public --tag "$tag"
            fi
          }

          publish_or_verify "$linux_tarball" "$RELEASE_VERSION-linux-x64" linux-x64
          publish_or_verify "$windows_tarball" "$RELEASE_VERSION-win32-x64" win32-x64
          publish_or_verify "$argus_tarball" "$RELEASE_VERSION" beta

          test "$(npm view @argusevolve/argus dist-tags.linux-x64)" = "$RELEASE_VERSION-linux-x64"
          test "$(npm view @argusevolve/argus dist-tags.win32-x64)" = "$RELEASE_VERSION-win32-x64"
          test "$(npm view @argusevolve/argus dist-tags.beta)" = "$RELEASE_VERSION"

      - name: Create GitHub prerelease from the audited assets
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Argus $RELEASE_TAG" \
            --notes-file release/notes.md \
            --prerelease \
            release/assets/*
