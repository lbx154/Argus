name: extended checks

# On-demand only: the web cockpit's own tests, before a release or when a change
# touches the web UI. The desktop itself (Tauri host, the Argus it ships, its
# installers) is desktop.yml.

on:
  workflow_dispatch:

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend · web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm --prefix frontend/web ci
      - name: Typecheck web
        run: npm --prefix frontend/web run typecheck
      - name: Test web
        run: npm --prefix frontend/web test
