name: release

# Release version changes are operator-controlled. Do not bump package versions
# for a bug fix unless the operator explicitly authorizes that release change.
# v0.1.2 through v0.1.5 are operator-authorized desktop releases, published explicitly
# without running test suites. Tests belong to the separate tests workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Build one desktop target, or all"
        type: choice
        default: all
        options:
          - all
          - windows-x86_64
          - darwin-aarch64
          - darwin-x86_64
          - linux-x86_64

permissions:
  contents: read

jobs:
  python:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    name: build · wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            frontend/tui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
      - name: Build release sources
        run: |
          npm --prefix frontend/web run build
          npm --prefix frontend/tui run build
      - name: Validate tag and package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tauri_desktop_version = json.loads(
              Path("desktop-tauri/package.json").read_text(encoding="utf-8")
          )["version"]
          cargo_version = tomllib.loads(
              Path("desktop-tauri/src-tauri/Cargo.toml").read_text(encoding="utf-8")
          )["package"]["version"]
          tauri_config_version = json.loads(
              Path("desktop-tauri/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{python_version}", (
              f"tag {tag!r} does not match Python package version {python_version!r}"
          )
          for name, version in {
              "Tauri desktop": tauri_desktop_version,
              "Tauri Cargo": cargo_version,
              "Tauri config": tauri_config_version,
          }.items():
              assert version == python_version, (
                  f"{name} version {version!r} does not match Python package version "
                  f"{python_version!r}"
              )
          PY
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  desktop:
    name: build · ${{ matrix.platform }} desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows-x86_64' && '[{"os":"windows-latest","platform":"windows-x86_64"}]' || inputs.platform == 'darwin-aarch64' && '[{"os":"macos-15","platform":"darwin-aarch64"}]' || inputs.platform == 'darwin-x86_64' && '[{"os":"macos-15-intel","platform":"darwin-x86_64"}]' || inputs.platform == 'linux-x86_64' && '[{"os":"ubuntu-22.04","platform":"linux-x86_64"}]' || '[{"os":"windows-latest","platform":"windows-x86_64"},{"os":"macos-15","platform":"darwin-aarch64"},{"os":"macos-15-intel","platform":"darwin-x86_64"},{"os":"ubuntu-22.04","platform":"linux-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            frontend/tui/package-lock.json
            desktop-tauri/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      # The Tauri shell pulls in several hundred crates; compiling them cold is
      # the single longest step on every platform (10 min on the Intel Mac
      # runner). Keep the compiled dependencies between runs. Only main saves,
      # so tag builds restore main's cache instead of leaving one-off copies.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
          shared-key: desktop-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb xauth dbus-x11 libfuse2
      - name: Install build dependencies
        run: |
          python -m pip install -e ".[trial]" "pyinstaller>=6.11,<7" tzdata
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
          npm --prefix desktop-tauri ci
      - name: Build release sources
        run: |
          npm --prefix frontend/web run build
          npm --prefix frontend/tui run build
      - name: Build frozen backend
        run: npm --prefix desktop-tauri run build:backend
      - name: Build signed desktop updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm --prefix desktop-tauri run build
      - name: Stage Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop-tauri/scripts/stage-release.ps1
      - name: Stage Mac installer and updater
        if: runner.os == 'macOS'
        run: python desktop-tauri/scripts/stage-macos-release.py
      - name: Stage Linux installer and updater
        if: runner.os == 'Linux'
        run: python desktop-tauri/scripts/stage-linux-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-tauri/release/*
          if-no-files-found: error

  pypi:
    name: publish · PyPI
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.1.2' && github.ref != 'refs/tags/v0.1.3' && github.ref != 'refs/tags/v0.1.4' && github.ref != 'refs/tags/v0.1.5'
    needs: [python, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/argus-skill/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    name: publish · GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.1.2' && github.ref != 'refs/tags/v0.1.4'
    needs: [python, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Require signed updater manifest
        run: |
          test -s release-assets/latest.json
          test -n "$(find release-assets -name '*.sig' -print -quit)"
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Verify merged updater manifest and generate release notes
        run: python source/desktop-tauri/scripts/prepare-github-release.py release-assets --notes release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: release-body.md
