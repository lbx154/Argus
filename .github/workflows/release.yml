name: release

# Release version changes are operator-controlled. Do not bump package versions
# for a bug fix unless the operator explicitly authorizes that release change.
# v0.1.2, v0.1.3 and v0.1.4 are operator-authorized desktop releases, published explicitly
# after installer validation. Do not auto-publish PyPI or mixed release assets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: build · wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
      - name: Build release sources
        run: python -m argus_skill.release_tools.build_release
      - name: Validate tag and package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tauri_desktop_version = json.loads(
              Path("desktop-tauri/package.json").read_text(encoding="utf-8")
          )["version"]
          cargo_version = tomllib.loads(
              Path("desktop-tauri/src-tauri/Cargo.toml").read_text(encoding="utf-8")
          )["package"]["version"]
          tauri_config_version = json.loads(
              Path("desktop-tauri/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{python_version}", (
              f"tag {tag!r} does not match Python package version {python_version!r}"
          )
          for name, version in {
              "Tauri desktop": tauri_desktop_version,
              "Tauri Cargo": cargo_version,
              "Tauri config": tauri_config_version,
          }.items():
              assert version == python_version, (
                  f"{name} version {version!r} does not match Python package version "
                  f"{python_version!r}"
              )
          PY
      - name: Build distributions
        run: python -m build
      - name: Clean-install wheel smoke
        run: |
          python -m venv /tmp/argus-wheel-smoke
          /tmp/argus-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/argus-wheel-smoke/bin/argus-skill --version
          # Isolated mode prevents the repository checkout from shadowing the
          # wheel that was just installed into the clean environment.
          /tmp/argus-wheel-smoke/bin/python -I - <<'PY'
          from pathlib import Path
          import argus_skill
          root = Path(argus_skill.__file__).parent
          assert (root / "_frontend/web/dist/index.html").is_file()
          assert (root / "_frontend/tui/bundle/argus.mjs").is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  desktop:
    name: build · ${{ matrix.platform }} desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-14
            platform: darwin-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          python -m pip install -e ".[trial]" pytest ruff "httpx2>=2.9,<3" "pyinstaller>=6.11,<7" tzdata
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
          npm --prefix desktop-tauri ci
      - name: Install WebKit for Mac workbench checks
        if: runner.os == 'macOS'
        working-directory: desktop-tauri
        run: npx playwright install webkit
      - name: Validate native desktop and trial components
        env:
          ARGUS_TEST_NATIVE_COPILOT: '1'
        run: |
          python -m ruff check argus_skill/trial desktop-tauri/scripts tests/trial tests/desktop
          python -m pytest tests/trial/test_desktop.py tests/trial/test_client.py tests/desktop --tb=short
          npm --prefix desktop-tauri run ui:typecheck
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --lib --test core_tests
      - name: Build release sources
        run: python -m argus_skill.release_tools.build_release
      - name: Verify embedded workbench and trial setup UI
        run: npm --prefix desktop-tauri run test:ui -- --workers=2
      - name: Build frozen backend
        run: npm --prefix desktop-tauri run build:backend
      - name: Build signed desktop updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm --prefix desktop-tauri run build
      - name: Stage Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop-tauri/scripts/stage-release.ps1
      - name: Stage Mac installer and updater
        if: runner.os == 'macOS'
        run: python desktop-tauri/scripts/stage-macos-release.py
      - name: Verify installed trial and native GUI restart
        env:
          ARGUS_TRIAL_SMOKE_KEY: ${{ secrets.ARGUS_TRIAL_SMOKE_KEY }}
        run: |
          python - <<'PYSMOKE'
          import pathlib, subprocess, sys
          suffix = '*.exe' if sys.platform == 'win32' else '*.dmg'
          packages = list(pathlib.Path('desktop-tauri/release').glob(suffix))
          assert len(packages) == 1, packages
          subprocess.run([sys.executable, 'desktop-tauri/scripts/smoke-trial-release.py', str(packages[0])], check=True)
          PYSMOKE
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-tauri/release/*
          if-no-files-found: error

  pypi:
    name: publish · PyPI
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.1.2' && github.ref != 'refs/tags/v0.1.3' && github.ref != 'refs/tags/v0.1.4'
    needs: [python, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/argus-skill/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    name: publish · GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.1.2' && github.ref != 'refs/tags/v0.1.4'
    needs: [python, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Require signed updater manifest
        run: |
          test -s release-assets/latest.json
          test -n "$(find release-assets -name '*.sig' -print -quit)"
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Verify merged updater manifest and generate release notes
        run: python source/desktop-tauri/scripts/prepare-github-release.py release-assets --notes release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: release-body.md
