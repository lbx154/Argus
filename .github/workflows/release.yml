name: release

# Release version changes are operator-controlled. Do not bump package versions
# for a bug fix unless the operator explicitly authorizes that release change.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: build · wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
      - name: Build release sources
        run: python -m argus_skill.release_tools.build_release
      - name: Validate tag and package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tauri_desktop_version = json.loads(
              Path("desktop-tauri/package.json").read_text(encoding="utf-8")
          )["version"]
          cargo_version = tomllib.loads(
              Path("desktop-tauri/src-tauri/Cargo.toml").read_text(encoding="utf-8")
          )["package"]["version"]
          tauri_config_version = json.loads(
              Path("desktop-tauri/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{python_version}", (
              f"tag {tag!r} does not match Python package version {python_version!r}"
          )
          for name, version in {
              "Tauri desktop": tauri_desktop_version,
              "Tauri Cargo": cargo_version,
              "Tauri config": tauri_config_version,
          }.items():
              assert version == python_version, (
                  f"{name} version {version!r} does not match Python package version "
                  f"{python_version!r}"
              )
          PY
      - name: Build distributions
        run: python -m build
      - name: Clean-install wheel smoke
        run: |
          python -m venv /tmp/argus-wheel-smoke
          /tmp/argus-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/argus-wheel-smoke/bin/argus-skill --version
          # Isolated mode prevents the repository checkout from shadowing the
          # wheel that was just installed into the clean environment.
          /tmp/argus-wheel-smoke/bin/python -I - <<'PY'
          from pathlib import Path
          import argus_skill
          root = Path(argus_skill.__file__).parent
          assert (root / "_frontend/web/dist/index.html").is_file()
          assert (root / "_frontend/tui/bundle/argus.mjs").is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  windows:
    name: build · Windows Tauri installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            frontend/tui/package-lock.json
            desktop-tauri/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.11,<7"
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
          npm --prefix desktop-tauri ci
      - name: Build release sources and frozen backend
        shell: pwsh
        run: |
          python -m argus_skill.release_tools.build_release
          npm --prefix frontend/web run build
          ./desktop-tauri/scripts/build-backend.ps1 -SkipInstall
      - name: Build signed Tauri Desktop and stage release artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required: unsigned desktop updates must never be published."
          }
          npm --prefix desktop-tauri run build
          ./desktop-tauri/scripts/stage-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktop-tauri/release/*.exe
            desktop-tauri/release/*.sig
            desktop-tauri/release/latest.json

  pypi:
    name: publish · PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/argus-skill/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    name: publish · GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets
      - name: Require signed updater manifest
        run: |
          test -s release-assets/latest.json
          test -n "$(find release-assets -name '*.sig' -print -quit)"
      - name: Generate release notes from staged artifacts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import textwrap
          import zipfile
          from pathlib import Path

          assets = Path("release-assets")
          installers = list(assets.glob("Argus-*-setup.exe"))
          wheels = list(assets.glob("*.whl"))
          assert len(installers) == 1, installers
          assert len(wheels) == 1, wheels

          installer = installers[0]
          digest = hashlib.sha256(installer.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheels[0]) as archive:
              manifest = json.loads(
                  archive.read("argus_skill/release_manifest.json")
              )
          version = str(manifest["package_version"])
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          release_id = str(manifest["release_id"])
          Path("release-body.md").write_text(
              textwrap.dedent(f"""\
              ## Argus {version}

              Refreshed signed Tauri Desktop preview release.

              ### Highlights

              - Desktop messages default to Auto routing instead of forcing every input into the task pipeline
              - Existing installations reset the old implicit Task preference while preserving new explicit choices
              - Frozen local Python backend with verified runtime ownership
              - Manager → Planner → Engineer → Reviewer task pipeline
              - Signed desktop update metadata

              ### Windows

              Download `{installer.name}`.

              SHA-256: `{digest}`

              Release identity: `{release_id}`
              """),
              encoding="utf-8",
          )
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: release-body.md
