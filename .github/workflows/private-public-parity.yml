name: private-public parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch matching public tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIVATE_HEAD: ${{ github.event.pull_request.head.sha }}
          PUBLIC_BRANCH: ${{ github.head_ref }}
        run: |
          git remote add public https://github.com/lbx154/Argus.git
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PRIVATE_HEAD" ]
          then
            echo "PRIVATE_REF=$PRIVATE_HEAD" >> "$GITHUB_ENV"
          else
            echo "PRIVATE_REF=HEAD" >> "$GITHUB_ENV"
          fi
          if [ "$EVENT_NAME" = "pull_request" ] &&
             [ -n "$PUBLIC_BRANCH" ] &&
             git check-ref-format --branch "$PUBLIC_BRANCH" >/dev/null &&
             git ls-remote --exit-code --heads public "$PUBLIC_BRANCH" >/dev/null
          then
            git fetch --no-tags public \
              "refs/heads/$PUBLIC_BRANCH:refs/remotes/public/parity"
            echo "PUBLIC_REF=public/parity" >> "$GITHUB_ENV"
          else
            git fetch --no-tags public main
            echo "PUBLIC_REF=public/main" >> "$GITHUB_ENV"
          fi
      - name: Verify product tree parity
        run: |
          python argus_skill/release_tools/check_repository_parity.py \
            --private-ref "$PRIVATE_REF" \
            --public-ref "$PUBLIC_REF"
