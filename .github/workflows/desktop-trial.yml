name: Desktop installers

on:
  workflow_dispatch:
  # A change pushed straight to dev is checked too, not only one in a PR.
  push:
    branches: [dev]
    paths:
      - 'argus/trial/**'
      - 'desktop-tauri/**'
      - '.github/workflows/desktop-trial.yml'
  pull_request:
    paths:
      - 'argus/trial/**'
      - 'desktop-tauri/**'
      - '.github/workflows/desktop-trial.yml'

permissions:
  contents: read

jobs:
  desktop:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          python -m pip install -e ".[trial]" pytest "pyinstaller>=6.11,<7" tzdata
          npm ci
          npm --prefix desktop-tauri ci
          npm --prefix frontend/web ci
          npm --prefix frontend/tui ci
      - name: Verify desktop and shared trial compatibility
        env:
          ARGUS_TEST_NATIVE_COPILOT: '1'
        run: |
          python -m pytest tests/trial/test_desktop.py tests/trial/test_client.py tests/desktop --tb=short
          npm --prefix desktop-tauri run ui:typecheck
          cargo check --manifest-path desktop-tauri/src-tauri/Cargo.toml
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --lib --test core_tests
      - name: Build desktop with frozen Python runtime
        env:
          ARGUS_TEST_NATIVE_COPILOT: '1'
        run: |
          python -m argus.release_tools.build_release
          npm --prefix desktop-tauri run build:backend
          npm --prefix desktop-tauri run build:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: argus-desktop-${{ matrix.os }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
