name: core

# The TypeScript core's tests on every host it ships to, on each push to its branches. Once
# merged, tests.yml covers it with the other packages.

on:
  push:
    branches: ['feat/ts-core*']

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test "packages/core/test/*.test.ts"
      - name: Probe real CLIs (temporary)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm i -g @openai/codex @anthropic-ai/claude-code > /dev/null 2>&1
          prefix="$(npm prefix -g)"; echo "== npm $(npm -v), prefix $prefix"
          tail -n 1 "$prefix/codex.cmd" "$prefix/claude.cmd"
          node --input-type=module -e "
            import { launcher } from './packages/core/dist/agent/sandbox.js';
            import { execFileSync } from 'node:child_process';
            for (const name of ['codex', 'claude']) {
              const [file, ...args] = launcher(name);
              console.log('== launcher', name, JSON.stringify([file, ...args]));
              console.log(execFileSync(file, [...args, '--version'], { encoding: 'utf8' }).trim());
            }"
          set +e +o pipefail
          mkdir -p probe && cd probe
          inside="$(cygpath -w "$PWD")"
          write='require("fs").writeFileSync(process.argv[1], "x"); console.log("wrote", process.argv[1])'
          for mode in none unelevated; do
            set=(); [ $mode = none ] || set=(-c "windows.sandbox=\"$mode\"")
            for dir in "$inside" "$USERPROFILE"; do
              echo "== windows.sandbox $mode, writing in $dir"
              codex sandbox "${set[@]}" -c 'sandbox_mode="workspace-write"' -- node -e "$write" "$dir\\probe-$mode.txt" 2>&1 | tail -n 12
              echo "exit ${PIPESTATUS[0]}"
            done
          done
          ls "$inside" "$USERPROFILE" | grep probe
