name: core

# The TypeScript core's tests on every host it ships to, on each push to its branches. Once
# merged, tests.yml covers it with the other packages.

on:
  push:
    branches: ['feat/ts-core*']

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test "packages/core/test/*.test.ts"
