[package]
name = "argus-desktop"
version = "0.1.1"
description = "Argus desktop host"
authors = ["lbx154"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "argus_desktop_lib"
# Windows desktop only; avoiding cdylib/staticlib keeps the GNU local test toolchain
# from exporting the entire Tauri surface while CI/release builds the normal executable.
crate-type = ["rlib"]

[[bin]]
name = "Argus"
path = "src/main.rs"

[[test]]
name = "core_tests"
path = "src/core_tests.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-notification = "2.3"
tauri-plugin-single-instance = "2.3"
tauri-plugin-updater = "2.10"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.15"
