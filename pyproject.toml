[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-skill"
version = "0.1.0"
description = "Argus — Autonomous Research Generation & Understanding System. A 7x24 agent that autonomously produces academic papers from idea to submission."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "lbx154", email = "lbxhaixing154@sjtu.edu.cn" },
]
keywords = ["agent", "llm", "auto-research", "academic-paper", "emnlp", "autonomous", "pipeline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "rich>=13.7",
  "PyYAML>=6",
]

[project.optional-dependencies]
# NOTE: the historical `argus-skill[codex]` extra used to install the
# upstream ArgusBot package for its `codex_autoloop` module. That module
# is now vendored under `argus_skill/codex_autoloop/`, so no separate
# install is required. The extra is kept as an empty alias so that legacy
# `pip install 'argus-skill[codex]'` invocations in user scripts still
# succeed without pulling in anything.
codex = []
dev = [
  "build>=1",
  "mypy>=1.8,<2",
  "pytest>=7",
  "ruff>=0.4",
]

[project.scripts]
argus-skill = "argus_skill.__main__:main"

[project.urls]
Homepage = "https://github.com/lbx154/argus-skill"
Repository = "https://github.com/lbx154/argus-skill"

[tool.hatch.build.targets.wheel]
packages = ["argus_skill"]

[tool.hatch.build.targets.wheel.force-include]
"argus_skill/engineer/reviewer_schema.json" = "argus_skill/engineer/reviewer_schema.json"
"argus_skill/planner/planner_schema.json" = "argus_skill/planner/planner_schema.json"
"argus_skill/builtin_skills" = "argus_skill/builtin_skills"
"argus_skill/wiki/templates" = "argus_skill/wiki/templates"
"argus_skill/codex_autoloop" = "argus_skill/codex_autoloop"

[tool.hatch.build.targets.sdist]
include = [
  "argus_skill/**",
  "tests/**",
  "docs/**",
  "README.md",
  "LICENSE",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "build",
  "dist",
  ".venv",
  "argus/app",
  "codex/app",
  "benchmarks/swebench_pro",
  "pyknotid-scratch",
  "pyknotid_capability",
]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = [
  "E501",
  "E402",
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["argus_skill"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
exclude = '''^(?:benchmarks|build|dist|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.venv|argus/app|codex/app|pyknotid-scratch|pyknotid_capability)(?:/|$)'''
files = [
  "argus_skill",
  "tests",
]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["codex_autoloop.*", "argus_skill.codex_autoloop.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "argus_skill.builtin_skills.engineer.figure_spec_scripts.*",
  "argus_skill.tools.project_templates.code.*",
  "tests.*",
]
ignore_errors = true
