[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-skill"
version = "0.1.1"
description = "Argus — Autonomous Research Generation & Understanding System. A 7x24 agent that autonomously produces academic papers from idea to submission."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "lbx154", email = "lbxhaixing154@sjtu.edu.cn" },
]
keywords = ["agent", "llm", "auto-research", "academic-paper", "emnlp", "autonomous", "pipeline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "rich>=13.7",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
# NOTE: the historical `argus-skill[codex]` extra used to install the
# upstream ArgusBot package for its `codex_autoloop` module. That module
# is now vendored under `argus_skill/agent_cli/`, so no separate
# install is required. The extra is kept as an empty alias so that legacy
# `pip install 'argus-skill[codex]'` invocations in user scripts still
# succeed without pulling in anything.
codex = []
# `argus-skill[figures]` — publication chart styling for scripted DATA plots
# (argus_skill/builtin_skills/engineer/figure_spec_scripts/paper_chart_style.py:
# SciencePlots base + colour-blind-safe seaborn palettes + font embedding).
# Kept OUT of the base deps: the daemon/cockpit never plot, and paper projects
# install these into their OWN venv (the `paper-chart-styling` skill copies the
# helper into `paper/analysis/` and runs `pip install matplotlib seaborn
# SciencePlots` there). Declared here so `argus-skill[figures]` is available for
# environments that do want them on the harness side, and the helper degrades to
# plain matplotlib if they are absent.
figures = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "SciencePlots>=2.1",
]
# `argus-skill[signing]` — the Ed25519 result-provenance feature
# (argus_skill/team/result_provenance.py) is off by default (inert unless
# ARGUS_EVAL_SIGNING_KEY / ARGUS_TEAMMATE_RESULT_VERIFY_KEY is set) and
# imports `cryptography` lazily, so it stays out of the base dependency
# list — most installs never touch signing and don't need the extra
# native-crypto build weight. Install this extra only if you're wiring up
# signed teammate results.
signing = [
  "cryptography>=41",
]
# Build the proprietary preview executable distributed through npm. PyInstaller
# embeds Python bytecode and package data into one native launcher; pip-licenses
# emits the third-party notices shipped next to that executable.
binary = [
  "pyinstaller>=6.19,<7",
  "pip-licenses>=5",
  "cryptography>=41",
  "jsonschema>=4",
  "pypdf>=5",
  "python-multipart>=0.0.20",
  "itsdangerous>=2",
]
# `argus-skill[web]` — the optional web/TUI backend API (argus_skill/webapi/).
# A thin FastAPI layer over the file-based daemon pub/sub (events.jsonl +
# backlog/inbox) that the Ink terminal frontend (frontend/tui/) and the React
# web frontend (frontend/web/) both talk to. Kept OUT of the base deps so the
# 7x24 daemon + Rich cockpit stay dependency-light; install only to run
# `argus-skill --web`. Defaults to a 127.0.0.1 bind.
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]
dev = [
  "build>=1",
  "mypy>=1.8,<2",
  "pytest>=7",
  "ruff>=0.4",
  # tests/team/test_result_provenance.py + tests/team/test_teammate_entry.py +
  # tests/test_eval_signing.py exercise the signing path directly, so `dev`
  # needs it too — otherwise `pip install -e ".[dev]" && pytest -q` (the
  # README's documented test setup) fails those tests on a clean checkout.
  "cryptography>=41",
  # tests/planner/test_planner.py::test_planner_schema_accepts_dag_and_flat_tasks
  # validates the planner's structured-output JSON schema directly. Not used
  # anywhere in argus_skill/ runtime code — test-only, so it belongs here
  # rather than as its own installable extra.
  "jsonschema>=4",
]

[project.scripts]
argus = "argus_skill.apps.tui_launcher:main"
argus-skill = "argus_skill.__main__:main"

[project.urls]
Homepage = "https://github.com/lbx154/argus-skill"
Repository = "https://github.com/lbx154/argus-skill"

[tool.hatch.build.targets.wheel]
packages = ["argus_skill"]
# NOTE: hatchling's `packages` already vendors every file under argus_skill/
# (builtin_skills/*.md, the *_schema.json, wiki/templates, codex_autoloop), so
# no force-include is needed. Force-including those package dirs would re-add
# their __init__.py and fail the build with a duplicate-path error.

[tool.hatch.build.targets.wheel.force-include]
"frontend/tui/bundle/argus.mjs" = "argus_skill/_frontend/tui/bundle/argus.mjs"
"frontend/web/dist" = "argus_skill/_frontend/web/dist"

[tool.hatch.build.targets.sdist]
# ``dist/`` is VCS-ignored even though the production Web bundle is tracked.
# Mark it as an artifact so a wheel rebuilt from the sdist still has the forced
# frontend source required by the wheel target.
artifacts = [
  "frontend/web/dist/**",
]
include = [
  "argus_skill/**",
  "tests/**",
  "docs/**",
  "frontend/tui/bundle/**",
  "README.md",
  "LICENSE",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "build",
  "dist",
  ".venv",
  "argus/app",
  "codex/app",
  "pyknotid-scratch",
]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = [
  "E501",
  "E402",
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["argus_skill"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: crosses local process, thread, filesystem, or API boundaries",
  "e2e: exercises a complete workflow through a real entry point or toolchain",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
exclude = '''^(?:build|dist|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.venv|argus/app|codex/app|pyknotid-scratch)(?:/|$)'''
files = [
  "argus_skill",
  "tests",
]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["codex_autoloop.*", "argus_skill.agent_cli.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "argus_skill.builtin_skills.engineer.figure_spec_scripts.*",
  "argus_skill.tools.project_templates.code.*",
  "tests.*",
]
ignore_errors = true
