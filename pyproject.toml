[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-skill"
version = "0.1.1"
description = "Argus — a persistent, reviewed runtime for autonomous research and engineering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "lbx154" },
]
keywords = ["agent", "llm", "research", "engineering", "autonomous", "workflow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "rich>=13.7",
  "PyYAML>=6",
  "portalocker>=3",
  "jsonschema>=4",
  "pypdf>=5,<7",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "mcp>=1.20,<2",
  "pydantic-settings>=2.5.2,<2.15",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Optional plotting stack for publication figures.
figures = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "SciencePlots>=2.1",
]
# Quantitative analysis and model tooling.
quant = [
  "numpy>=1.26",
  "pandas>=2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "mplfinance>=0.12.10b0",
  "lightgbm>=4",
  "torch>=2.2",
]
# Browser-based figure rendering.
visual-web = [
  "playwright>=1.50,<2",
]
# Layout-aware PDF inspection.
paper = [
  "pymupdf>=1.26,<2",
  "pypdf>=5,<7",
]
# Optional Ed25519 provenance signing.
signing = [
  "cryptography>=41",
]
# Traditional/simplified Chinese folding for literary checks.
zh-fold = [
  "opencc>=1.1",
]
# Feishu / Lark chat bridge. Only the inbound WebSocket long connection needs
# the SDK — outbound replies go through urllib like the Telegram bridge — so
# this stays optional and the bridge simply lies dormant when it is absent.
feishu = [
  "lark-oapi>=1.5,<2",
]
# Terminal QR code for pairing a phone with a LAN-exposed web UI. Degrades to
# printing the URL alone when unavailable.
qr = [
  "qrcode>=7.4,<9",
]
# Harbor Framework installed-agent adapter. Harbor itself requires Python
# 3.12+, while core Argus continues to support Python 3.11.
harbor = [
  "build>=1",
  "hatchling>=1.27",
  "harbor>=0.21,<0.22; python_version >= '3.12'",
]
dev = [
  "build>=1",
  "mypy>=1.8,<2",
  "pytest>=7",
  "qrcode>=7.4,<9",
  "ruff>=0.4",
  "cryptography>=41",
  "httpx2>=2.9,<3",
  "numpy>=1.26",
  "pandas>=2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "mplfinance>=0.12.10b0",
  "lightgbm>=4",
  "torch>=2.2",
]

[project.scripts]
argus = "argus_skill.apps.tui_launcher:main"
argus-doctor = "argus_doctor:main"
argus-skill = "argus_skill.__main__:main"
argus-plugin-server = "argus_skill.plugin.mcp_server:main"

[project.urls]
Homepage = "https://github.com/lbx154/Argus"
Repository = "https://github.com/lbx154/Argus"

[tool.hatch.build.targets.wheel]
packages = ["argus_skill"]
# Package Markdown and JSON files are runtime Skill data.

[tool.hatch.build.targets.wheel.force-include]
"argus_doctor.py" = "argus_doctor.py"
"frontend/tui/bundle/argus.mjs" = "argus_skill/_frontend/tui/bundle/argus.mjs"
"frontend/web/dist" = "argus_skill/_frontend/web/dist"

[tool.hatch.build.targets.sdist]
# Include checked-in frontend artifacts in source distributions.
artifacts = [
  "frontend/web/dist/**",
]
include = [
  "argus_doctor.py",
  "argus_skill/**",
  "tests/**",
  "frontend/tui/bundle/**",
  "README.md",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "build",
  "dist",
  ".venv",
  "argus/app",
  "codex/app",
  "pyknotid-scratch",
]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = [
  "E501",
  "E402",
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["argus_skill"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: crosses local process, thread, filesystem, or API boundaries",
  "e2e: exercises a complete workflow through a real entry point or toolchain",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
exclude = '''^(?:build|dist|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.venv|argus/app|codex/app|pyknotid-scratch)(?:/|$)'''
# Type-check stable shared contracts.
files = [
  "argus_skill/core",
  "argus_skill/life/router.py",
  "argus_skill/manager/config_intent.py",
  "argus_skill/agent_cli/copilot_acp.py",
  "argus_skill/webapi/diagnostics.py",
]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
