<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Erdős 707 case timeline</title>
<desc id="desc">Argus Math Vertical diagram. Schematic unless explicitly marked actual.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101b38"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d8ff"/><stop offset="1" stop-color="#776dff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .title{font:700 30px ui-sans-serif,system-ui;fill:#eef7ff} .sub{font:500 15px ui-sans-serif,system-ui;fill:#90a8c2}
    .h{font:700 20px ui-sans-serif,system-ui;fill:#fff} .t{font:500 14px ui-sans-serif,system-ui;fill:#c8d8e8}
    .mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#7ee8ff} .box{fill:#10233b;stroke:#2d5875;stroke-width:1.5;rx:18}
    .accent{fill:url(#cyan);rx:18} .line{stroke:#50c9f5;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#7187a0;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#50c9f5"/></marker>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/>

<text x="60" y="70" class="title">Erdős #707 · mechanism case</text><text x="60" y="102" class="sub">ACTUAL SNAPSHOT · not a claim that the open problem is solved</text>
<line x1="130" y1="300" x2="1070" y2="300" stroke="#50c9f5" stroke-width="4"/>
<circle cx="180" cy="300" r="18" fill="#38d8ff"/><text x="180" y="255" text-anchor="middle" class="h">scope</text><text x="180" y="350" text-anchor="middle" class="t">problem certified</text>
<circle cx="510" cy="300" r="18" fill="#776dff"/><text x="510" y="255" text-anchor="middle" class="h">solve</text><text x="510" y="350" text-anchor="middle" class="t">bounded structural work</text>
<circle cx="840" cy="300" r="18" fill="#ffbf5a"/><text x="840" y="255" text-anchor="middle" class="h">review</text><text x="840" y="350" text-anchor="middle" class="t">correctness / novelty split</text>
<path d="M870 325 C1050 410 660 500 540 330" class="dash"/><text x="820" y="480" class="sub">open campaign can roll back for a new mechanism</text>
<rect x="120" y="545" width="960" height="70" class="box"/><text x="600" y="575" text-anchor="middle" class="t">独立审计 L35 的 C7 方法边界</text><text x="600" y="600" text-anchor="middle" class="mono">publishable target remains independently gated</text>

</svg>
