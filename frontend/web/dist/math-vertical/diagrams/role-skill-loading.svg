<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Generic roles loading Math skills</title>
<desc id="desc">Argus Math Vertical diagram. Schematic unless explicitly marked actual.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101b38"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d8ff"/><stop offset="1" stop-color="#776dff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .title{font:700 30px ui-sans-serif,system-ui;fill:#eef7ff} .sub{font:500 15px ui-sans-serif,system-ui;fill:#90a8c2}
    .h{font:700 20px ui-sans-serif,system-ui;fill:#fff} .t{font:500 14px ui-sans-serif,system-ui;fill:#c8d8e8}
    .mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#7ee8ff} .box{fill:#10233b;stroke:#2d5875;stroke-width:1.5;rx:18}
    .accent{fill:url(#cyan);rx:18} .line{stroke:#50c9f5;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#7187a0;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#50c9f5"/></marker>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/>

<text x="60" y="70" class="title">Generic roles load Math context</text><text x="60" y="102" class="sub">SCHEMATIC · Scientist is optional on skill miss/failure</text>
<path d="M130 250 H1070" class="line"/>
<g><rect x="60" y="190" width="180" height="120" class="box"/><text x="150" y="235" text-anchor="middle" class="h">Manager</text><text x="150" y="270" text-anchor="middle" class="t">route + stage authority</text></g>
<g><rect x="285" y="190" width="180" height="120" class="box"/><text x="375" y="235" text-anchor="middle" class="h">Planner</text><text x="375" y="270" text-anchor="middle" class="t">dynamic research work</text></g>
<g><rect x="510" y="190" width="180" height="120" class="box"/><text x="600" y="235" text-anchor="middle" class="h">Scientist</text><text x="600" y="270" text-anchor="middle" class="t">optional adaptation</text></g>
<g><rect x="735" y="190" width="180" height="120" class="box"/><text x="825" y="235" text-anchor="middle" class="h">Engineer</text><text x="825" y="270" text-anchor="middle" class="t">artifact + evidence</text></g>
<g><rect x="960" y="190" width="180" height="120" class="box"/><text x="1050" y="235" text-anchor="middle" class="h">Reviewer</text><text x="1050" y="270" text-anchor="middle" class="t">independent verdict</text></g>
<rect x="175" y="420" width="850" height="110" class="accent"/><text x="600" y="462" text-anchor="middle" class="h">math/stages.py · role_banner(role)</text>
<text x="600" y="495" text-anchor="middle" class="t">five markdown contexts; generic implementations stay unchanged</text>
<path d="M150 310 L300 420" class="dash"/><path d="M375 310 L450 420" class="dash"/><path d="M600 310 V420" class="dash"/><path d="M825 310 L750 420" class="dash"/><path d="M1050 310 L900 420" class="dash"/>

</svg>
