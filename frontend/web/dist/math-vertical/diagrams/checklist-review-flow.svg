<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Checklist and Reviewer flow</title>
<desc id="desc">Argus Math Vertical diagram. Schematic unless explicitly marked actual.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101b38"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d8ff"/><stop offset="1" stop-color="#776dff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .title{font:700 30px ui-sans-serif,system-ui;fill:#eef7ff} .sub{font:500 15px ui-sans-serif,system-ui;fill:#90a8c2}
    .h{font:700 20px ui-sans-serif,system-ui;fill:#fff} .t{font:500 14px ui-sans-serif,system-ui;fill:#c8d8e8}
    .mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#7ee8ff} .box{fill:#10233b;stroke:#2d5875;stroke-width:1.5;rx:18}
    .accent{fill:url(#cyan);rx:18} .line{stroke:#50c9f5;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#7187a0;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#50c9f5"/></marker>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/>

<text x="60" y="70" class="title">Checklist / Review Harness</text><text x="60" y="102" class="sub">SCHEMATIC · no empty or not_loaded auto-pass</text>
<rect x="70" y="170" width="250" height="120" class="box"/><text x="195" y="215" text-anchor="middle" class="h">Artifacts</text><text x="195" y="252" text-anchor="middle" class="t">proof · ledger · logs</text>
<rect x="475" y="150" width="250" height="160" class="box"/><text x="600" y="195" text-anchor="middle" class="h">Required checklist</text><text x="600" y="230" text-anchor="middle" class="t">scope 3 · solve 5 · review 6</text><text x="600" y="265" text-anchor="middle" class="t">evidence per item</text>
<rect x="880" y="170" width="250" height="120" class="box"/><text x="1005" y="215" text-anchor="middle" class="h">Reviewer</text><text x="1005" y="252" text-anchor="middle" class="t">independent verdict</text>
<path d="M320 230 H475" class="line"/><path d="M725 230 H880" class="line"/>
<rect x="110" y="410" width="210" height="100" class="box"/><text x="215" y="450" text-anchor="middle" class="h">continue</text><text x="215" y="482" text-anchor="middle" class="t">specific next action</text>
<rect x="350" y="410" width="210" height="100" class="box"/><text x="455" y="450" text-anchor="middle" class="h">done</text><text x="455" y="482" text-anchor="middle" class="t">bounded evidence accepted</text>
<rect x="590" y="410" width="210" height="100" class="box"/><text x="695" y="450" text-anchor="middle" class="h">research_incomplete</text><text x="695" y="482" text-anchor="middle" class="t">contract not met</text>
<rect x="830" y="410" width="260" height="100" class="box"/><text x="960" y="450" text-anchor="middle" class="h">pause / exhausted</text><text x="960" y="482" text-anchor="middle" class="t">resumable generic lifecycle</text>
<path d="M1005 290 C1005 355 215 355 215 410" class="dash"/><path d="M1005 290 C1005 355 455 355 455 410" class="dash"/><path d="M1005 290 C1005 355 695 355 695 410" class="dash"/><path d="M1005 290 V410" class="dash"/>

</svg>
