<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Lean and exact verifier dual flow</title>
<desc id="desc">Argus Math Vertical diagram. Schematic unless explicitly marked actual.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101b38"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d8ff"/><stop offset="1" stop-color="#776dff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .title{font:700 30px ui-sans-serif,system-ui;fill:#eef7ff} .sub{font:500 15px ui-sans-serif,system-ui;fill:#90a8c2}
    .h{font:700 20px ui-sans-serif,system-ui;fill:#fff} .t{font:500 14px ui-sans-serif,system-ui;fill:#c8d8e8}
    .mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#7ee8ff} .box{fill:#10233b;stroke:#2d5875;stroke-width:1.5;rx:18}
    .accent{fill:url(#cyan);rx:18} .line{stroke:#50c9f5;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#7187a0;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#50c9f5"/></marker>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/>

<text x="60" y="70" class="title">Dual deterministic verification</text><text x="60" y="102" class="sub">SCHEMATIC · formal compilation and exact computation have separate scope</text>
<rect x="70" y="170" width="470" height="330" class="box"/><text x="105" y="215" class="h">Lean lane</text>
<text x="105" y="255" class="mono">Main.lean</text><text x="105" y="290" class="t">source proof-hole lexer</text><text x="105" y="320" class="t">real Mathlib compilation</text><text x="105" y="350" class="t">environment axiom audit</text><text x="105" y="380" class="t">statement fidelity is separate</text>
<text x="105" y="440" class="mono">compile.log · lean_check.json</text>
<rect x="660" y="170" width="470" height="330" class="box"/><text x="695" y="215" class="h">Exact verifier lane</text>
<text x="695" y="255" class="mono">deterministic Python</text><text x="695" y="290" class="t">integer / finite certificates</text><text x="695" y="320" class="t">literal output retained</text><text x="695" y="350" class="t">tested range stated</text><text x="695" y="380" class="t">never promoted to unbounded proof</text>
<text x="695" y="440" class="mono">script · output · limitations</text>
<rect x="250" y="555" width="700" height="70" class="accent"/><text x="600" y="598" text-anchor="middle" class="h">Reviewer compares both lanes to the original statement</text>
<path d="M305 500 L460 555" class="dash"/><path d="M895 500 L740 555" class="dash"/>

</svg>
