<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Math Vertical overall architecture</title>
<desc id="desc">Argus Math Vertical diagram. Schematic unless explicitly marked actual.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101b38"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d8ff"/><stop offset="1" stop-color="#776dff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .title{font:700 30px ui-sans-serif,system-ui;fill:#eef7ff} .sub{font:500 15px ui-sans-serif,system-ui;fill:#90a8c2}
    .h{font:700 20px ui-sans-serif,system-ui;fill:#fff} .t{font:500 14px ui-sans-serif,system-ui;fill:#c8d8e8}
    .mono{font:600 13px ui-monospace,SFMono-Regular,monospace;fill:#7ee8ff} .box{fill:#10233b;stroke:#2d5875;stroke-width:1.5;rx:18}
    .accent{fill:url(#cyan);rx:18} .line{stroke:#50c9f5;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#7187a0;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#50c9f5"/></marker>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/>

<text x="60" y="70" class="title">Math Vertical = Skills + Checklist / Harness + Stages</text>
<text x="60" y="102" class="sub">SCHEMATIC · domain specialization without duplicating the agent team</text>
<rect x="60" y="150" width="320" height="310" class="box" filter="url(#shadow)"/>
<text x="90" y="195" class="h">Dedicated Skills</text><text x="90" y="225" class="mono">5 role contexts</text>
<text x="90" y="270" class="t">Manager · Planner · Scientist</text><text x="90" y="300" class="t">Engineer · Reviewer</text>
<text x="90" y="360" class="t">Loaded by role_banner(role)</text><text x="90" y="390" class="t">No new role implementation</text>
<rect x="440" y="150" width="320" height="310" class="box" filter="url(#shadow)"/>
<text x="470" y="195" class="h">Checklist / Review Harness</text><text x="470" y="225" class="mono">14 required items</text>
<text x="470" y="270" class="t">statement · evidence · bounds</text><text x="470" y="300" class="t">fidelity · novelty · Lean audit</text>
<text x="470" y="360" class="t">Reviewer verdict is authoritative</text><text x="470" y="390" class="t">empty ≠ pass</text>
<rect x="820" y="150" width="320" height="310" class="box" filter="url(#shadow)"/>
<text x="850" y="195" class="h">Dedicated Stages</text><text x="850" y="225" class="mono">scope → solve → review</text>
<text x="850" y="270" class="t">coarse, problem-driven phases</text><text x="850" y="300" class="t">methods are selected dynamically</text>
<text x="850" y="360" class="t">Manager owns transition</text><text x="850" y="390" class="t">generic lifecycle remains shared</text>
<path d="M380 305 H440" class="line"/><path d="M760 305 H820" class="line"/>
<rect x="190" y="520" width="820" height="90" class="accent"/>
<text x="600" y="558" text-anchor="middle" class="h">Generic Core / Life</text>
<text x="600" y="588" text-anchor="middle" class="t">budget · pause/resume · checkpoint · research contract · provider guards</text>

</svg>
